name: Bug report
description: Report a problem with FicBurrow.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please do not include passwords, sync tokens, private library contents, or other personal data.
  - type: input
    id: version
    attributes:
      label: FicBurrow version
      placeholder: For example, 1.36.2
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and browser
      placeholder: For example, BOOX Note Air with Edge Canary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the steps to reproduce and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant error message
      description: Remove personal information and credentials before sharing.
    validations:
      required: false
